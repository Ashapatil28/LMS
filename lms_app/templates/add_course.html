{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4">

                <h3 class="text-center mb-4 text-primary">📚 Add New Course</h3>

                <form method="POST">
                    {% csrf_token %}

                    <input type="text" name="title" placeholder="Course Title"
                           class="form-control mb-3" required>

                    <textarea name="description" placeholder="Course Description"
                              class="form-control mb-3" rows="4" required></textarea>

                    <button type="submit" class="btn btn-success w-100">
                        Add Course
                    </button>
                </form>

                <a href="{% url 'trainer_dashboard' %}" class="btn btn-secondary w-100 mt-2">
                    ← Back to Dashboard
                </a>

            </div>
        </div>
    </div>
</div>

{% endblock %}
