{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
    <h2>All Courses</h2>

    {% for course in courses %}
        <div class="card p-3 mb-3">
            <h5>{{ course.title }}</h5>
            <p>{{ course.description }}</p>
            <a href="{% url 'course_detail' course.id %}" class="btn btn-primary">View Course</a>
        </div>
    {% empty %}
        <p>No courses available.</p>
    {% endfor %}
</div>

{% endblock %}
